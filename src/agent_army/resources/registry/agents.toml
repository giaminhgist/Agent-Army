schema_version = 1

[agents.orchestrator]
description = "Coordinate approved research tasks, route specialists and report progress."
role = "Research coordinator"
prompt_path = "prompts/orchestrator.md"
default_tier = "medium"
capabilities = ["planning","orchestration"]
output_contract = "plan-status"
recommendations_ref = "orchestrator"
keywords = ["plan","pipeline","ke hoach","dieu phoi"]
[agents.orchestrator.policy]
write_intent = "proposals"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.research]
description = "Search scientific literature, synthesize evidence and verify citations."
role = "Literature and evidence specialist"
prompt_path = "prompts/research.md"
default_tier = "light"
capabilities = ["literature-search","evidence-extraction","citation-verification"]
output_contract = "research-report"
recommendations_ref = "research"
keywords = ["literature","paper search","papers","tai lieu","tong quan"]
[agents.research.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.methodology]
description = "Develop testable hypotheses and design experiments before execution."
role = "Study and experiment designer"
prompt_path = "prompts/methodology.md"
default_tier = "medium"
capabilities = ["experimental-design","hypothesis-generation"]
output_contract = "experiment-protocol"
recommendations_ref = "methodology"
keywords = ["hypothesis","novelty","ablation","protocol","gia thuyet","thiet ke thi nghiem"]
[agents.methodology.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.data-steward]
description = "Inspect datasets, prevent leakage and prepare traceable derived data and splits."
role = "Research data steward"
prompt_path = "prompts/data-steward.md"
default_tier = "light"
capabilities = ["data-quality","data-preparation"]
output_contract = "data-card-split-manifest"
recommendations_ref = "data-steward"
keywords = ["dataset","missingness","leakage","split","du lieu"]
[agents.data-steward.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.coding]
description = "Implement and debug reproducible research software and baselines."
role = "Research software engineer"
prompt_path = "prompts/coding.md"
default_tier = "light"
capabilities = ["implementation","debugging","refactoring"]
output_contract = "code-test-report"
recommendations_ref = "coding"
keywords = ["code","implement","debug","bug","refactor","lap trinh","sua loi"]
[agents.coding.policy]
write_intent = "project-code"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.experiment]
description = "Run and monitor approved experiments with provenance and resource limits."
role = "Experiment operator"
prompt_path = "prompts/experiment.md"
default_tier = "light"
capabilities = ["experiment-execution","training-monitoring"]
output_contract = "run-records"
recommendations_ref = "experiment"
keywords = ["training","run experiment","train","gpu","chay thi nghiem"]
[agents.experiment.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.statistical-analyst]
description = "Analyze experimental results and quantify uncertainty and limits of claims."
role = "Statistical analysis specialist"
prompt_path = "prompts/statistical-analyst.md"
default_tier = "medium"
capabilities = ["statistical-analysis","error-analysis"]
output_contract = "analysis-claim-report"
recommendations_ref = "statistical-analyst"
keywords = ["statistics","confidence interval","effect size","p value","thong ke","phan tich ket qua"]
[agents.statistical-analyst.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.visualization]
description = "Create traceable scientific figures, tables and editable diagrams."
role = "Scientific visualization specialist"
prompt_path = "prompts/visualization.md"
default_tier = "light"
capabilities = ["scientific-visualization","diagram-design"]
output_contract = "figure-package"
recommendations_ref = "visualization"
keywords = ["figure","plot","chart","diagram","bieu do","so do"]
[agents.visualization.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.writing]
description = "Write evidence-grounded manuscripts, proposals and rebuttals; preserve meaning during editing."
role = "Scientific writing specialist"
prompt_path = "prompts/writing.md"
default_tier = "medium"
capabilities = ["scientific-writing","rebuttal"]
output_contract = "manuscript-package"
recommendations_ref = "writing"
keywords = ["manuscript","write paper","rebuttal","proposal","viet bai","ban thao"]
[agents.writing.policy]
write_intent = "artifacts"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.reviewer]
description = "Independently audit research methodology, code, results, citations and manuscripts."
role = "Independent scientific reviewer"
prompt_path = "prompts/reviewer.md"
default_tier = "medium"
capabilities = ["review","audit"]
output_contract = "review-verdict"
recommendations_ref = "reviewer"
keywords = ["review","audit","verify claims","phan bien","kiem dinh"]
[agents.reviewer.policy]
write_intent = "reviews"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]

[agents.knowledge-curator]
description = "Curate project/global knowledge and memory and prepare selective promotion previews."
role = "Knowledge and memory curator"
prompt_path = "prompts/knowledge-curator.md"
default_tier = "light"
capabilities = ["knowledge-curation","memory-curation"]
output_contract = "curation-promotion-proposal"
recommendations_ref = "knowledge-curator"
keywords = ["knowledge","memory","rag","wiki","tri thuc","bo nho"]
[agents.knowledge-curator.policy]
write_intent = "proposals"
approval_actions = ["step-start", "scope-change", "model-escalation", "global-promotion"]
